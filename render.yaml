# Render "Blueprint": describes the backend and its database so they can be created
# in one click (Render dashboard -> New -> Blueprint -> pick this repository).
# The frontend is deployed separately on Vercel (see docs/deploy.md).
databases:
  - name: spendsense-db
    databaseName: spendsense
    user: spendsense
    plan: free

services:
  - type: web
    name: spendsense-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: spendsense-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true            # Render creates a strong random value
      - key: SEED_DEMO_DATA
        value: "true"                  # loads the demo account on start, only if it doesn't exist yet
      - key: TRUST_PROXY
        value: "true"                  # Render's proxy sets X-Forwarded-For; needed for per-visitor rate limits
      - key: ALLOW_REGISTRATION
        value: "true"                  # set to "false" to close sign-ups instantly if abused
      - key: MAX_USERS
        value: "400"                   # cap on accounts so the free database can't fill up (0 = no cap)
      - key: CORS_ORIGINS
        sync: false                    # you enter your Vercel URL in the dashboard
      - key: RAZORPAY_KEY_ID
        sync: false                    # optional: Razorpay TEST keys
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
