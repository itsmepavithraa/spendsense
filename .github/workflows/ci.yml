# Continuous integration: runs on every push and pull request.
# A red build means something broke; a green one means the tests, the database
# migrations and the frontend build all still work.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-sqlite:
    name: Backend tests (SQLite, fast)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests -q

  backend-postgres:
    name: Backend tests (PostgreSQL + migrations)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: spendsense
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: spendsense_test
        ports:
          - 5432:5432
        # wait until the database accepts connections before the steps start
        options: >-
          --health-cmd "pg_isready -U spendsense -d spendsense_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://spendsense:ci_password@localhost:5432/spendsense_test
      TEST_DATABASE_URL: postgresql+psycopg2://spendsense:ci_password@localhost:5432/spendsense_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-secret-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Migrations apply from scratch
        run: alembic upgrade head
      - name: Migrations are reversible
        run: alembic downgrade base && alembic upgrade head
      - name: Tests on real PostgreSQL
        run: python -m pytest tests -q

  frontend:
    name: Frontend (type-check and build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
